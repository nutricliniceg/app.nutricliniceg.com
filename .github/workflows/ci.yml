name: CI (PR gate)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # Lockfile-strict install: fails if package-lock.json drifts (QA-05).
      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

      - name: Secret scan (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        with:
          config-path: .gitleaks.toml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ❌ UI-19: the build happens HERE in CI, never on the cPanel server.
      # `npm run build` also runs the P31 bundle + CSS gates.
      - run: npm run build
        env:
          BUILD_MODE: "true"
